name: Atlas Command 3.6 checks
on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check scheduler35.js
          node --check recurring36.js
          node --check atlas36-ui.js
          node --check sw.js
      - name: Planner smoke tests
        run: node --test tests/*.test.cjs
